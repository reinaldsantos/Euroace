<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - EuroACE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #24449b, #45c974); min-height: 100vh; display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        .carousel-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; }
        .carousel-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.5s ease-in-out; }
        .carousel-slide.active { opacity: 1; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 1; }
        .login { position: relative; z-index: 2; background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); }
        h1 { text-align: center; color: #24449b; margin-bottom: 30px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
        button { width: 100%; padding: 12px; background: #45c974; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        .error { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 8px; margin-top: 10px; display: none; text-align: center; }
        .carousel-dots { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 2; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.5); cursor: pointer; }
        .dot.active { background: white; }
        @media (max-width: 480px) { .login { margin: 20px; padding: 30px 20px; } }
    </style>
<script src="../config.js"></script>
</head>
<body>
    <div class="carousel-bg" id="carouselBg"></div>
    <div class="overlay"></div>
    <div class="login">
        <h1>🍽️ EuroACE Admin</h1>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Usuário" required>
            <input type="password" id="password" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>
        <div id="error" class="error"></div>
    </div>
    <div class="carousel-dots" id="carouselDots"></div>
    <script>
        // Usar a URL correta do backend
        const API_URL = window.API_URL || 'https://euroace.onrender.com/api';
        
        const imagens = ['../assets/carousel/epf1.jpg', '../assets/carousel/epf3.jpg', '../assets/carousel/epf4.jpg', '../assets/carousel/epf5.jpg'];
        let slideAtual = 0, intervalId = null;
        
        function criarSlides() {
            const container = document.getElementById('carouselBg');
            const dotsContainer = document.getElementById('carouselDots');
            imagens.forEach((img, index) => {
                const slide = document.createElement('div');
                slide.className = 'carousel-slide';
                if (index === 0) slide.classList.add('active');
                const testImg = new Image();
                testImg.onload = () => { slide.style.backgroundImage = `url(${img})`; };
                testImg.onerror = () => { slide.style.background = 'linear-gradient(135deg, #24449b, #1a3378)'; };
                testImg.src = img;
                container.appendChild(slide);
                const dot = document.createElement('div');
                dot.className = 'dot';
                if (index === 0) dot.classList.add('active');
                dot.addEventListener('click', () => irParaSlide(index));
                dotsContainer.appendChild(dot);
            });
        }
        
        function irParaSlide(index) {
            const slides = document.querySelectorAll('.carousel-slide');
            const dots = document.querySelectorAll('.dot');
            if (index >= slides.length) index = 0;
            slides.forEach(slide => slide.classList.remove('active'));
            dots.forEach(dot => dot.classList.remove('active'));
            slides[index].classList.add('active');
            dots[index].classList.add('active');
            slideAtual = index;
        }
        
        function proximoSlide() { irParaSlide(slideAtual + 1); }
        function iniciarCarrossel() { criarSlides(); intervalId = setInterval(proximoSlide, 5000); }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            
            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify({ username: data.user.username, role: data.user.role || 'admin' }));
                    window.location.href = 'dashboard.html';
                } else {
                    errorDiv.textContent = data.error || 'Erro no login';
                    errorDiv.style.display = 'block';
                    setTimeout(() => errorDiv.style.display = 'none', 3000);
                }
            } catch(e) {
                errorDiv.textContent = 'Erro de conexão com o servidor';
                errorDiv.style.display = 'block';
                setTimeout(() => errorDiv.style.display = 'none', 3000);
            }
        });
        
        window.addEventListener('DOMContentLoaded', iniciarCarrossel);
    </script>
</body>
</html>
