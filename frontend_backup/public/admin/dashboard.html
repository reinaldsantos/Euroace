<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - EuroACE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f0f0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 20px; padding: 30px; }
        h1 { color: #24449b; margin-bottom: 20px; }
        .btn { display: inline-block; padding: 10px 20px; background: #45c974; color: white; text-decoration: none; border-radius: 8px; margin: 10px 0; }
        .logout { background: #e74c3c; float: right; }
        .receita-form { margin-top: 30px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        textarea { min-height: 80px; }
        .row { display: flex; gap: 20px; margin-bottom: 15px; }
        .row > div { flex: 1; }
        button[type="submit"] { background: #45c974; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 20px; }
        .message { padding: 10px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .success { background: #d4edda; color: #155724; display: block; }
        .error { background: #f8d7da; color: #721c24; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Área Administrativa</h1>
        <button class="logout" onclick="logout()">Sair</button>
        <div style="clear:both"></div>
        
        <div id="message" class="message"></div>
        
        <form id="receitaForm">
            <div class="row">
                <div><label>Nº Ficha *</label><input type="text" id="numero_ficha" required></div>
                <div><label>Nome do Prato *</label><input type="text" id="nome_prato" required></div>
            </div>
            <div class="row">
                <div><label>Categoria *</label>
                    <select id="categoria" required>
                        <option value="entrada">🍽️ Entrada</option>
                        <option value="carne">🥩 Prato de Carne</option>
                        <option value="peixe">🐟 Prato de Peixe</option>
                        <option value="sobremesa">🍰 Sobremesa</option>
                        <option value="pastelaria">🥐 Pastelaria</option>
                    </select>
                </div>
                <div><label>Nº Porções</label><input type="number" id="numero_porcoes" value="4"></div>
            </div>
            <div class="row">
                <div><label>Tempo de Preparação</label><input type="text" id="tempo_preparacao"></div>
                <div><label>Forma de Preparação</label><input type="text" id="forma_preparacao"></div>
            </div>
            
            <h3>Ingredientes</h3>
            <div id="ingredientes">
                <div class="row" style="gap:10px"><input placeholder="Quantidade" class="qtd"><input placeholder="Produto" class="produto"></div>
            </div>
            <button type="button" onclick="addIngrediente()">+ Adicionar Ingrediente</button>
            
            <h3>Preparação</h3>
            <div id="preparacao">
                <div><textarea class="passo" placeholder="Passo 1..."></textarea></div>
            </div>
            <button type="button" onclick="addPasso()">+ Adicionar Passo</button>
            
            <h3>Material Necessário</h3>
            <textarea id="material_necessario"></textarea>
            
            <h3>Imagem</h3>
            <input type="file" id="imagem" accept="image/*">
            
            <button type="submit">💾 Salvar Receita</button>
        </form>
    </div>
    
    <script>
        const API_URL = 'http://localhost:3005/api';
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';
        
        function addIngrediente() {
            const div = document.createElement('div');
            div.className = 'row';
            div.style.gap = '10px';
            div.innerHTML = '<input placeholder="Quantidade" class="qtd"><input placeholder="Produto" class="produto">';
            document.getElementById('ingredientes').appendChild(div);
        }
        
        function addPasso() {
            const div = document.createElement('div');
            div.innerHTML = '<textarea class="passo" placeholder="Novo passo..."></textarea>';
            document.getElementById('preparacao').appendChild(div);
        }
        
        function getIngredientes() {
            const items = [];
            document.querySelectorAll('#ingredientes .row').forEach(row => {
                const qtd = row.querySelector('.qtd')?.value || '';
                const prod = row.querySelector('.produto')?.value || '';
                if (qtd || prod) items.push({ quantidade: qtd, produto: prod });
            });
            return items;
        }
        
        function getPreparacao() {
            const passos = [];
            document.querySelectorAll('#preparacao .passo').forEach((p, i) => {
                if (p.value.trim()) passos.push({ numero: i+1, descricao: p.value });
            });
            return passos;
        }
        
        document.getElementById('receitaForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('numero_ficha', document.getElementById('numero_ficha').value);
            formData.append('nome_prato', document.getElementById('nome_prato').value);
            formData.append('categoria', document.getElementById('categoria').value);
            formData.append('numero_porcoes', document.getElementById('numero_porcoes').value);
            formData.append('tempo_preparacao', document.getElementById('tempo_preparacao').value);
            formData.append('forma_preparacao', document.getElementById('forma_preparacao').value);
            formData.append('ingredientes', JSON.stringify(getIngredientes()));
            formData.append('preparacao', JSON.stringify(getPreparacao()));
            formData.append('material_necessario', document.getElementById('material_necessario').value);
            const img = document.getElementById('imagem').files[0];
            if (img) formData.append('imagem', img);
            
            try {
                const res = await fetch(`${API_URL}/receitas`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                const data = await res.json();
                const msg = document.getElementById('message');
                if (res.ok) {
                    msg.className = 'message success';
                    msg.textContent = '✅ Receita salva!';
                    setTimeout(() => msg.className = 'message', 3000);
                } else {
                    msg.className = 'message error';
                    msg.textContent = '❌ ' + data.error;
                }
            } catch(e) {
                document.getElementById('message').className = 'message error';
                document.getElementById('message').textContent = '❌ Erro ao salvar';
            }
        });
        
        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
